[alembic]
script_location = backend/alembic
prepend_sys_path = .
timezone = UTC

# env.py reads DATABASE_URL from the backend settings. This fallback is only
# used if env.py is bypassed by custom tooling.
sqlalchemy.url = sqlite:///backend/smartagro_local.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
