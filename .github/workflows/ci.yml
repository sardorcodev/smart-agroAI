name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  backend:
    name: Backend
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: sqlite:///${{ runner.temp }}/smartagro_ci.db
      ALLOWED_CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      ADMIN_EMAILS: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Check dependencies
        run: python -m pip check

      - name: Run tests
        run: python -m pytest backend/tests

      - name: Import smoke check
        run: |
          python -c "import backend.main as m; print('models_loaded', m.MODELS_LOADED); assert m.MODELS_LOADED is True"
