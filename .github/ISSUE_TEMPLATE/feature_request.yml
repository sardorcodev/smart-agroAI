name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or maintainer problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed solution
      description: Describe the smallest useful version of the solution.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider?
    validations:
      required: false
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be included or explicitly left out?
    validations:
      required: true
  - type: dropdown
    id: contribution
    attributes:
      label: Contribution willingness
      options:
        - I can open a pull request
        - I can help test or review
        - I am only suggesting the idea
    validations:
      required: true
